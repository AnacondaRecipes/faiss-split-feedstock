# CPU/CUDA variant axis (canonical gpu_variant pattern, cf. llama.cpp/pytorch).
# gpu_variant is the CPU-vs-CUDA gate used by meta.yaml selectors
# ((gpu_variant or "").startswith("cuda")) and the build scripts;
# cuda_compiler_version still carries the toolkit version for build strings and
# CUDA arch dispatch. The two lists are zipped 1:1. The local
# cuda_compiler_version list replaces the aggregate's values for this key,
# so it must include the supported CUDA versions for each platform.
gpu_variant:
  - none
  - cuda-12  # [linux or (win and x86_64)]
  - cuda-13  # [linux or (win and x86_64)]
  - cuda-13  # [win and arm64]

cuda_compiler_version:
  - None
  - "12.9"  # [linux or (win and x86_64)]
  - "13.0"  # [linux or (win and x86_64)]
  - "13.4"  # [win and arm64]

zip_keys:
  -
    - gpu_variant
    - cuda_compiler_version
