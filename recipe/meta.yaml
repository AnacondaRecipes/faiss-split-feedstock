package:
  name: faiss-split
  version: {{ version }}

source:
  url: https://github.com/facebookresearch/faiss/archive/v{{ version }}.tar.gz
  sha256: 0b94bf4b17229b28a8a6686d7637ce93de4ef25f6308040184675befad9d9332
  patches:
    # adapt header target directory for faiss_avx2
    - patches/0002-adapt-header-target-directory-to-outputname.patch
    # patch for avoiding crash in GPU test suite on windows
    - patches/0003-skip-test_stress-for-GPU-on-windows.patch
    # enable building libfaiss_avx2 without libfaiss
    - patches/0004-enable-building-libfaiss_avx2-without-libfaiss.patch
    # increase tolerance for test that occasionally fails marginally
    - patches/0005-increase-tolerance-for-marginally-failing-test.patch
    # ensure contrib.ivf_tools passes contiguous buffers to SWIG wrappers
    - patches/0013-fix-ivf-tools-range-search-preassigned.patch
    # fix MSVC template disambiguation for CUDA builds (Windows only)
    - patches/0014-fix-MSVC-template-disambiguation.patch  # [win and gpu_variant == "cuda"]
    # fix FAISS_DISABLE_CPU_FEATURES env var parsing
    - patches/0015-fix-FAISS_DISABLE_CPU_FEATURES-parsing.patch
    # fix Windows CUDA build: 'small' macro conflict with rpcndr.h
    - patches/0018-fix-windows-small-macro-conflict.patch  # [win and gpu_variant == "cuda"]

build:
  number: {{ build_number + 100 }}  # [gpu_variant == "cuda"]
  number: {{ build_number }}        # [gpu_variant == "none"]

requirements:
  build:
    - {{ compiler('c') }}
    - {{ compiler('cxx') }}
    - {{ compiler('cuda') }}  # [gpu_variant == "cuda"]
    - cmake
    - ninja-base
    - llvm-openmp  {{ cxx_compiler_version }}     # [blas_impl == "openblas" and osx]
    - intel-openmp  # [blas_impl == "mkl" and (linux or win)]
  host:
    - python
    # BLAS dependencies based on variant
    - openblas-devel {{ openblas }}  # [blas_impl == "openblas"]
    - libgomp 15.2.0                        # [blas_impl == "openblas" and linux]
    - vcomp14                        # [blas_impl == "openblas" and (win and x86_64)]
    - mkl-devel {{ mkl }}            # [blas_impl == "mkl"]
    - mkl {{ mkl }}                  # [blas_impl == "mkl"]
    - intel-openmp                   # [blas_impl == "mkl" and (linux or win)]
    - numpy {{ numpy }}

outputs:
  # # A meta-package to select CPU or GPU build for faiss.
  # - name: faiss-proc
  #   version: 1.0.0
  #   build:
  #     string: "{{ faiss_proc_type }}"
  #     number: 0
  #   test:
  #     commands:
  #       - exit 0

  # build two separate C++ libs, one generic, and one for AVX2 on x86_64
  {% set CF_FAISS_BUILD_OPTS = ["generic"] %}
  {% set CF_FAISS_BUILD_OPTS = ["avx2"] + CF_FAISS_BUILD_OPTS %}  # [x86_64]
  {% for CF_FAISS_BUILD in CF_FAISS_BUILD_OPTS %}
  # order libfaiss last in loop due to conda/conda-build#4090; libfaiss-avx2
  # is only used for faiss and not important enough to work-around for this bug
  {% if CF_FAISS_BUILD == "generic" %}
  - name: libfaiss
  {% else %}
  - name: libfaiss-avx2
  {% endif %}
  {% set libext = "_avx2" if CF_FAISS_BUILD == "avx2" else "" %}
    # only one main build script build-lib.{bat|sh}, with the only difference
    # through CF_FAISS_BUILD={generic,avx2} that's set in the wrappers
    script: build-lib-{{ CF_FAISS_BUILD }}.sh   # [not win]
    script: build-lib-{{ CF_FAISS_BUILD }}.bat  # [win]
    build:
      number: {{ build_number + 100 }}  # [gpu_variant == "cuda"]
      number: {{ build_number }}        # [gpu_variant == "none"]
      string: "h{{ PKG_HASH }}_{{ PKG_BUILDNUM }}_{{ faiss_proc_type }}"                                                  # [gpu_variant == "none"]
      string: "cuda{{ cuda_compiler_version|replace(".", "") }}h{{ PKG_HASH }}_{{ PKG_BUILDNUM }}_{{ faiss_proc_type }}"  # [gpu_variant == "cuda"]
      run_exports:
        # faiss follows SemVer, so restrict packages built with libfaiss to use
        # at least the same version at runtime, but below the next major version.
        - libfaiss{{ libext }} >={{ version }},<2
        # additionally, we need to ensure matching proc-type
        - libfaiss{{ libext }} =*=*_{{ faiss_proc_type }}
    requirements:
      build:
        - {{ compiler('c') }}
        - {{ compiler('cxx') }}
        - {{ compiler('cuda') }}  # [gpu_variant == "cuda"]
        - cmake
        - ninja-base
        - llvm-openmp  {{ cxx_compiler_version }}     # [blas_impl == "openblas" and osx]
      host:
        # NOTE: Do NOT add python here - libfaiss is a C++ library and should not
        # depend on python_abi. Adding python causes the package to be tied to a
        # specific Python version, breaking installation for other Python versions.
        # BLAS dependencies based on variant
        - openblas-devel {{ openblas }}  # [blas_impl == "openblas"]
        - libgomp                        # [blas_impl == "openblas" and linux]
        - vcomp14                        # [blas_impl == "openblas" and (win and x86_64)]
        - mkl-devel {{ mkl }}            # [blas_impl == "mkl"]
        - mkl {{ mkl }}                  # [blas_impl == "mkl"]
        - intel-openmp                   # [blas_impl == "mkl" and (linux or win)]
        # CUDA dependencies for GPU builds
        - cuda-version {{ cuda_compiler_version }}  # [gpu_variant == "cuda"]
        - cuda-cudart-dev  # [gpu_variant == "cuda"]
        - cuda-profiler-api  # [gpu_variant == "cuda"]
        - libcublas-dev  # [gpu_variant == "cuda"]
        - libcurand-dev  # [gpu_variant == "cuda"]
      run:
        # Run dependencies based on variant
        - libopenblas                            # [blas_impl == "openblas"]
        - libgomp                                # [blas_impl == "openblas" and linux]
        - vcomp14                                # [blas_impl == "openblas" and (win and x86_64)]
        - mkl {{ mkl }}.*                        # [blas_impl == "mkl"]
        - {{ pin_compatible('intel-openmp') }}   # [blas_impl == "mkl" and (linux64 or win)]
        - llvm-openmp  # [blas_impl == "openblas" and osx]
      run_constrained:
        - faiss-cpu ==9999999999  # [gpu_variant == "cuda"]
        - faiss-gpu ==9999999999  # [gpu_variant == "none"]
        - faiss-proc =*={{ faiss_proc_type }}

    test:
      commands:
        # shared
        - test -f $PREFIX/lib/libfaiss{{ libext }}.so               # [linux]
        - test -f $PREFIX/lib/libfaiss{{ libext }}.dylib            # [osx]
        - if not exist %LIBRARY_BIN%\faiss{{ libext }}.dll exit 1   # [win]
        # On windows, faiss.lib is an "import library";
        # Deleting it breaks the faiss-builds
        - if not exist %LIBRARY_LIB%\faiss{{ libext }}.lib exit 1   # [win]

        # absence of static libraries
        - test ! -f $PREFIX/lib/libfaiss{{ libext }}.a              # [not win]

        # headers
        {% for each_header in headers %}
        - test -f $PREFIX/include/faiss{{ libext }}/{{ each_header }} || (echo "{{ each_header }} not found" && exit 1)  # [unix]
        - if not exist %LIBRARY_INC%\faiss{{ libext }}\{{ "\\".join(each_header.split("/")) }} exit 1                    # [win]
        {% endfor %}
  {% endfor %}

  - name: faiss
    script: build-pkg.sh          # [not win]
    script: build-pkg.bat         # [win]
    build:
      number: {{ build_number + 100 }}  # [gpu_variant == "cuda"]
      number: {{ build_number }}        # [gpu_variant == "none"]
      string: "py{{ PY_VER|replace(".","") }}h{{ PKG_HASH }}_{{ PKG_BUILDNUM }}_{{ faiss_proc_type }}"                                                  # [gpu_variant == "none"]
      string: "py{{ PY_VER|replace(".","") }}cuda{{ cuda_compiler_version|replace(".", "") }}h{{ PKG_HASH }}_{{ PKG_BUILDNUM }}_{{ faiss_proc_type }}"  # [gpu_variant == "cuda"]
    requirements:
      build:
        - {{ compiler('c') }}
        - {{ compiler('cxx') }}
        - {{ compiler('cuda') }}  # [gpu_variant == "cuda"]
        - swig
        - cmake
        - ninja-base
        - llvm-openmp  {{ cxx_compiler_version }}     # [blas_impl == "openblas" and osx]
      host:
        - python
        - wheel
        - packaging
        - setuptools
        - pip
        - numpy {{ numpy }}
        - openblas-devel {{ openblas }}  # [blas_impl == "openblas"]
        - libgomp                        # [blas_impl == "openblas" and linux]
        - vcomp14                        # [blas_impl == "openblas" and (win and x86_64)]
        # MKL builds link the SWIG extensions against libiomp5 directly.
        - mkl-devel {{ mkl }}     # [blas_impl == "mkl"]
        - intel-openmp            # [blas_impl == "mkl" and (linux or win)]
        # CUDA dependencies for GPU builds (needed for SWIG wrapper compilation)
        - cuda-version {{ cuda_compiler_version }}  # [gpu_variant == "cuda"]
        - cuda-cudart-dev  # [gpu_variant == "cuda"]
        - libcublas-dev  # [gpu_variant == "cuda"]
        - libfaiss ={{ version }}=*_{{ faiss_proc_type }}
        - libfaiss-avx2 ={{ version }}=*_{{ faiss_proc_type }}  # [x86_64]
      run:
        - python
        - libfaiss ={{ version }}=*_{{ faiss_proc_type }}
        - libfaiss-avx2 ={{ version }}=*_{{ faiss_proc_type }}  # [x86_64]
        - numpy >=2.0
        - packaging
        # bounds through run_exports
        - libopenblas            # [blas_impl == "openblas"]
        - libgomp                # [blas_impl == "openblas" and linux]
        - vcomp14                # [blas_impl == "openblas" and (win and x86_64)]
        - mkl                    # [blas_impl == "mkl"]
        - {{ pin_compatible('intel-openmp') }}   # [blas_impl == "mkl" and (linux or win)]
        - llvm-openmp            # [blas_impl == "openblas" and osx]
      run_constrained:
        - faiss-cpu ==9999999999  # [gpu_variant == "cuda"]
        - faiss-gpu ==9999999999  # [gpu_variant == "none"]
        - faiss-proc =*={{ faiss_proc_type }}

    test:
      requires:
        - scipy
        - pytest
      files:
        - test-pkg.bat
        - test-pkg.sh
      source_files:
        - tests/
      imports:
        - faiss
      commands:
        {% set skip = "_not_a_real_test" %}
        # flaky double encoding test that occasionally fails
        {% set skips = "test_RQ6x8" %}
        # two failing tests on on aarch (test_index_accuracy & test_index_accuracy2)
        {% set skips = skips + " or (test_residual_quantizer and test_index_accuracy)" %}  # [aarch64 or ppc64le]
        # test_ivf_train_2level fails randomly on linux-64. Upstream recently increased the threshold. Tried that, but still failing occasionally.
        {% set skips = skips + " or test_ivf_train_2level" %}  # [linux and x86_64]
        # Fast scan IVF add test has precision issues on macOS
        {% set skips = skips + " or (TestAdd and test_add)" %}  # [osx]
        # Speed tests on aarch64 and arm64 ocassionally take a bit longer than threshold
        {% set skips = skips + " or test_PQ4_speed" %}  # [aarch64 or arm64]
        # Panorama tests have floating point precision issues on Windows
        {% set skips = skips + " or test_flat_panorama or test_refine_panorama" %}  # [win]
        # IVFFastScan merge test has non-deterministic results on Windows
        {% set skips = skips + " or test_merge_IVFFastScan" %}  # [win]
        # IndexFastScan merge test has non-deterministic results on Windows
        {% set skips = skips + " or (TestMerge2 and test_merge_IndexFastScan_even_M)" %}  # [win]
        # test_hnsw has non-deterministic results on Windows
        {% set skips = skips + " or (TestHNSW and test_hnsw)" %}  # [win]
        # Exhaustive range search query iterator test is flaky on Windows
        {% set skips = skips + " or test_query_iterator" %}  # [win]
        # the linux & windows CI agents support AVX2 (OSX doesn't yet), so by default,
        # we expect faiss will load the library with AVX2-support, see
        # https://github.com/facebookresearch/faiss/blob/v1.7.1/faiss/python/loader.py#L52-L66
        - export HAS_AVX2=YES && export SKIPS="({{ skips }})" && ./test-pkg.sh  # [linux and x86_64]
        - export HAS_AVX2=NO  && export SKIPS="({{ skips }})" && ./test-pkg.sh  # [osx or (linux and not x86_64)]
        - set "HAS_AVX2=YES"  && set "SKIPS=({{ skips }})"    && test-pkg.bat   # [win]

        # running the following test requires an actual GPU device, which is not available in CI
        # - pytest faiss/gpu/test/

  # for compatibility with (& ease of migration from) existing packages in the pytorch channel
  # - name: faiss-cpu
  #   build:
  #     skip: true  # [cuda_compiler_version != "None"]
  #     # some MKL issue for py 3.8 on osx-64
  #     skip: true  # [py==38 and osx and x86_64]
  #   requirements:
  #     run:
  #       - faiss ={{ version }}=*_cpu
  #   test:
  #     imports:
  #       - faiss

